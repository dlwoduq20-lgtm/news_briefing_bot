name: Daily Morning News Briefing (08:00 KST)

on:
  schedule:
    # 매일 한국시간 08:00 AM = UTC 23:00 (전날 밤 11시)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 지원

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 모닝 뉴스 브리핑 실행 및 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # GitHub Secrets에 저장된 KAKAO_TOKEN_JSON 복원
          if [ -n "${{ secrets.KAKAO_TOKEN_JSON }}" ]; then
            echo '${{ secrets.KAKAO_TOKEN_JSON }}' > kakao_token.json
          fi
          python main.py
